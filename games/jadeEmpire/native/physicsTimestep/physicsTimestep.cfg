# How often the game's physics objects (cloth among them) step, in steps per
# second of real time: a number (30 is the original game), frameRate for the frame
# rate limit in d3d9Borderless.cfg (auto there being the monitor's refresh rate),
# or 0 for one step per frame from that frame's own time. The damping each step
# applies is scaled so the cloth settles as fast as in the original at any rate.
stepsPerSecond=frameRate

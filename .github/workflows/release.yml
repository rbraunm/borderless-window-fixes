# Every game under games builds on each pull request to main; on main, each game whose release files changed gets a
# GitHub release of its zip, named for the day and the commit built.
name: release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - native/**
      - games/**
      - cmake/**
      - CMakeLists.txt
      - build.ps1
      - layout.ps1
      - package.ps1
      - release.ps1
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # cmd starts each script in a PowerShell process of its own: run inside a powershell step, Windows PowerShell
      # would turn the compiler's and pip's stderr into errors.
      - name: Test environment
        shell: cmd
        run: |
          python -m venv .venv || exit /b 1
          .venv\Scripts\python.exe -m pip install -e .

      # Releases only the games whose DLLs changed since their last release (release.ps1); a pull request reports which.
      - name: Release changed games
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if "${{ github.event_name }}"=="push" (
            powershell -NoProfile -ExecutionPolicy Bypass -File release.ps1 -test -publish
          ) else (
            powershell -NoProfile -ExecutionPolicy Bypass -File release.ps1 -test
          )

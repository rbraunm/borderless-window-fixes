# The NVIDIA driver profile setting "Vulkan/OpenGL present method" for the game's
# executable, written before the game starts OpenGL so this launch already uses it.
# Only the profile of this one executable is changed; on a PC without an NVIDIA
# GPU nothing happens.
#   native     present OpenGL the classic way: a borderless window stays a window
#              Windows composes, so the monitor keeps its HDR and refresh state
#   layered    present OpenGL through a DXGI swap chain, which the driver may
#              promote to fullscreen (and switch an HDR monitor to SDR for)
#   auto       let the driver choose (its default)
#   unchanged  leave the profile as it is
openglPresentMethod=native

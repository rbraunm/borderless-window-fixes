# How the game's borderless window is sized when it asks for exactly the size and
# position of its monitor. A window that matches its monitor exactly is taken
# over by some drivers as if it were fullscreen, which can switch the monitor's
# mode (HDR to SDR) every time the game gains or loses focus.
#   taller   one pixel taller than the monitor; the extra row is off screen
#   shorter  one pixel shorter than the monitor; the desktop shows in the
#            bottom row
#   none     the size the game asks for
heightAdjustment=taller

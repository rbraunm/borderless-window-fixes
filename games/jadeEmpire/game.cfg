# Jade Empire: Special Edition (BioWare, ported by LTI Gray Matter; Direct3D 9), Steam app 7110.
# The game's executable, relative to its install folder. version.dll and the windowFixes folder go beside it.
executable=JadeEmpire.exe
# The executable's architecture, x64 or x86, which picks the build.
architecture=x86
# The launcher's Play runs the configuration program, which checks for Steam before it starts the game.
companion=JadeEmpireConfig.exe

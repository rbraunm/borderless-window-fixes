# The most frames per second the game presents, held by waiting before each frame:
# auto for the refresh rate of the game's monitor, 0 to leave the frame rate to
# the game and its vertical sync, or a number. Jade Empire's own cap is 30
# (ClampFPS, which renderSettings turns off); its simulation advances by real time,
# but some of its animation may advance a fixed step per frame and run faster the
# higher this is.
frameRateLimit=auto

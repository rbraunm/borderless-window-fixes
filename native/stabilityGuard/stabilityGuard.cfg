# stabilityGuard settings. A setting missing here is added with its default when the game starts, and one
# this release does not use is removed and noted in the log. Delete the file to start over.

# Full reports (registers, stack, modules, and a memory dump of the stacks) are
# written for this many distinct crash addresses per session; after that each
# crash is only counted. These are exceptions the game may survive. A crash that
# ends the game is always reported, whatever this count.
maxFullReports=10

# Memory dumps (.dmp, opened with WinDbg or Visual Studio) go next to the session
# logs in logs\stabilityGuard, written with the system's dbghelp.dll. A crash that
# ends the game and a freeze each get a dump of all of the game's memory, a few
# hundred MB; a crash the game may survive gets a small one.
writeMemoryDumps=true

# Once the dumps add up to more than this many GB, the oldest are removed. They
# are never removed for their age. 0 means no limit.
maxDumpGigabytes=30

# How many 4-byte stack slots above the crash to scan for return addresses. Catches
# callers the frame-pointer walk misses in code built without frame pointers. At
# most 1024.
stackScanSlots=128

# A freeze is the game's window not responding (the main thread has not looked at
# its messages for 5 seconds, when Windows starts calling it Not Responding) for
# this many seconds more. Each freeze is logged with where the game is stuck and,
# with writeMemoryDumps, dumped. 0 turns freeze watching off.
freezeSeconds=60

# Quitting that always works. Closing the game window (X button, Alt+F4) or the
# game starting to quit (its own Quit or Exit) arms a timer; if the game is
# still running this many seconds later, it is terminated as Task Manager would.
# Use false to leave quitting entirely to the game.
exitGuard=true
exitGraceSeconds=10

# Ctrl+Alt+F4 terminates the game in front immediately, even one that stopped responding; with several
# games running, only that one (needs exitGuard=true).
forceExitHotkey=true
